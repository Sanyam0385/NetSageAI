<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetSage AI Dashboard</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5b6776;
      --line: #d8dee8;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --blue: #1f6feb;
      --teal: #0f766e;
      --red: #c2410c;
      --amber: #b7791f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      padding: 24px 32px 18px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 0; }
    header p { margin: 0; color: var(--muted); }
    main { padding: 24px 32px 36px; max-width: 1180px; margin: 0 auto; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric { padding: 16px; }
    .metric span { display: block; color: var(--muted); font-size: 13px; }
    .metric strong { display: block; margin-top: 8px; font-size: 26px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .panel { padding: 18px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    .bar { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px; align-items: center; margin: 9px 0; }
    .track { height: 12px; background: #e8edf5; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: var(--blue); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
    .tag { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #e8f3ff; color: #114f9d; font-size: 12px; }
    .high { color: var(--red); font-weight: 700; }
    .medium { color: var(--amber); font-weight: 700; }
    .low { color: var(--teal); font-weight: 700; }
    pre { white-space: pre-wrap; background: #111827; color: #e5e7eb; padding: 14px; border-radius: 8px; overflow: auto; }
    @media (max-width: 760px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      .metrics, .grid { grid-template-columns: 1fr; }
      .bar { grid-template-columns: 96px 1fr 36px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>NetSage AI</h1>
    <p>Packet Tracer troubleshooting cases with deterministic checks and required human review.</p>
  </header>
  <main>
    <section class="metrics" id="metrics"></section>
    <section class="grid">
      <div class="panel">
        <h2>Issue Coverage</h2>
        <div id="coverage"></div>
      </div>
      <div class="panel">
        <h2>Severity Mix</h2>
        <div id="severity"></div>
      </div>
      <div class="panel">
        <h2>Human Review Corrections</h2>
        <table>
          <thead><tr><th>Case</th><th>Decision</th><th>Correction</th></tr></thead>
          <tbody id="reviewRows"></tbody>
        </table>
      </div>
      <div class="panel">
        <h2>Demo Diagnosis</h2>
        <pre id="demo">Run python src\demo.py --case-id CASE-001 to generate outputs\demo_diagnosis.json.</pre>
      </div>
    </section>
  </main>
  <script>
    const casesCsv = `case_id,issue_type,severity,osi_layer,concept_tag,symptom,topology_note,show_outputs,expected_fault,expected_fix
CASE-001,VLAN,High,2,VLAN membership,"PC in VLAN 30 gets IP but cannot reach server in same VLAN.","Access switch SW1 connects PC3 on Fa0/12 and server on Fa0/20.","show vlan brief: VLAN 30 missing Fa0/12; Fa0/12 listed in VLAN 1 | show interfaces fa0/12 switchport: Access Mode VLAN: 1","PC access port is in the wrong VLAN.","Set Fa0/12 to access VLAN 30 and verify with show vlan brief."
CASE-002,VLAN,Medium,2,Trunk allowed VLAN,"VLAN 20 users cannot reach the router subinterface; VLAN 10 works.","SW1 trunk Gi0/1 connects to R1 router-on-a-stick.","show interfaces trunk: Gi0/1 allowed vlans 1,10,30 | show ip interface brief: Gi0/1.20 up/up 192.168.20.1","VLAN 20 is not allowed on the trunk.","Add VLAN 20 to the trunk allowed list."
CASE-003,Gateway,High,3,Default gateway,"PC receives 192.168.10.25/24 but cannot reach other networks.","Default gateway should be R1 Gi0/0.10 at 192.168.10.1.","ipconfig: IPv4 192.168.10.25 Mask 255.255.255.0 Gateway 192.168.10.254 | show ip int brief: Gi0/0.10 192.168.10.1 up/up","Client has the wrong default gateway.","Correct the DHCP default-router option or static gateway to 192.168.10.1."
CASE-004,Gateway,Medium,3,Gateway mismatch,"PC can ping local printer but not the internet.","Small office LAN uses 10.10.5.0/24 with gateway 10.10.5.1.","ipconfig: IPv4 10.10.5.44 Mask 255.255.255.0 Gateway 10.10.6.1 | show ip route: C 10.10.5.0/24 is directly connected","Gateway is outside the client subnet.","Set gateway to 10.10.5.1."
CASE-005,DHCP,High,7,DHCP excluded range,"New PCs get APIPA addresses in VLAN 40.","R1 is DHCP server for VLAN 40.","show ip dhcp pool VLAN40: Network 192.168.40.0/24 Default-router 192.168.40.1 | show ip dhcp binding: none | show run interface gi0/0.40: encapsulation dot1q 40 ip address 192.168.40.1 255.255.255.0","DHCP service is disabled or requests are not reaching the server.","Enable DHCP service and verify relay/trunk path."
CASE-006,DHCP,Medium,7,DHCP relay,"Remote VLAN 50 clients do not get addresses from central DHCP server.","DHCP server is 172.16.0.10 behind router HQ.","show run interface vlan50: ip address 192.168.50.1 255.255.255.0 no ip helper-address | show ip dhcp server statistics: 0 messages received","Missing DHCP relay helper on VLAN 50 gateway.","Add ip helper-address 172.16.0.10 on the VLAN 50 gateway interface."
CASE-007,DHCP,Medium,7,DHCP pool network,"VLAN 60 clients receive addresses but cannot ping gateway.","Gateway is 192.168.60.1/24.","show ip dhcp binding: 192.168.6.21 assigned | show ip dhcp pool: Network 192.168.6.0/24 Default-router 192.168.60.1","DHCP pool network is wrong.","Change the pool network to 192.168.60.0/24."
CASE-008,DNS,Medium,7,DNS server,"Users can ping 8.8.8.8 but cannot open example.com.","Branch PCs use DHCP.","ipconfig /all: DNS Servers 192.168.99.99 | nslookup example.com: DNS request timed out | ping 8.8.8.8 succeeds","Incorrect DNS server assigned to clients.","Update DHCP DNS option to a reachable DNS server."
CASE-009,DNS,Low,7,DNS record,"Only app.corp.local fails; other DNS names resolve.","Internal DNS server hosts corp.local zone.","nslookup app.corp.local: Non-existent domain | nslookup web.corp.local: 10.1.1.20","Missing or incorrect DNS A record.","Add or correct the app.corp.local A record."
CASE-010,Routing,High,3,Missing static route,"Branch LAN can reach its router but not HQ server 10.0.10.10.","R2 connects branch 192.168.20.0/24 to HQ through R1.","show ip route on R2: no route to 10.0.10.0/24 | ping 10.0.10.10 source 192.168.20.1 fails","R2 lacks a route to the HQ subnet.","Add a static route or dynamic routing entry toward R1."
CASE-011,Routing,High,3,Wrong next hop,"Branch has a static route to HQ but traffic still fails.","R2 next hop to R1 should be 172.16.12.1.","show ip route: S 10.0.10.0/24 [1/0] via 172.16.21.1 | show cdp neighbors: R1 on 172.16.12.1 link","Static route uses the wrong next hop.","Replace the route with next hop 172.16.12.1."
CASE-012,Routing,Medium,3,OSPF passive interface,"OSPF neighbors form on WAN but LAN route is missing at HQ.","R2 advertises branch LAN through OSPF.","show ip ospf interface brief: Gi0/1 passive | show ip route ospf on R1: no 192.168.20.0/24","OSPF is not advertising the branch LAN.","Correct OSPF network statements/passive settings for the LAN."
CASE-013,ACL,High,4,ACL deny,"VLAN 30 can ping gateway but cannot reach server TCP 80.","ACL applied inbound on router subinterface.","show access-lists: 10 deny tcp 192.168.30.0 0.0.0.255 host 10.0.10.20 eq 80 | show ip interface gi0/0.30: inbound access list is 10","ACL blocks HTTP from VLAN 30.","Modify ACL to permit required HTTP traffic."
CASE-014,ACL,Medium,3,Implicit deny,"Only one permitted subnet can cross router; all others fail unexpectedly.","ACL 101 was added for testing.","show access-lists 101: permit ip 192.168.10.0 0.0.0.255 any | show ip interface gi0/0: outbound access list is 101","ACL is missing needed permit statements, causing implicit deny.","Add explicit permits for required subnets or remove the ACL."
CASE-015,ACL,High,4,ACL direction,"Guest network can access internal server despite deny rule.","ACL was intended to protect 10.0.10.0/24.","show access-lists GUEST-BLOCK: deny ip 192.168.99.0 0.0.0.255 10.0.10.0 0.0.0.255 permit ip any any | show ip interface gi0/1: outbound access list is not set; inbound access list is not set","ACL exists but is not applied to the interface/direction.","Apply the ACL on the guest interface in the correct direction."
CASE-016,NAT,High,3,NAT overload,"Inside users can ping router outside interface but not the internet.","R1 performs NAT overload to ISP.","show ip nat translations: empty | show run: ip nat inside source list 1 interface s0/0/0 overload; access-list 1 permit 192.168.1.0 0.0.0.255 | inside LAN is 192.168.10.0/24","NAT ACL does not match the inside subnet.","Change NAT ACL to permit 192.168.10.0/24."
CASE-017,NAT,Medium,3,NAT interface roles,"NAT configured but translations never appear.","R1 LAN Gi0/0, ISP S0/0/0.","show run int gi0/0: no ip nat inside | show run int s0/0/0: ip nat outside","Inside NAT role missing on LAN interface.","Configure ip nat inside on the LAN interface."
CASE-018,NAT,Medium,3,Static NAT,"External users cannot reach internal web server.","Server 192.168.10.50 should publish as 203.0.113.50.","show ip nat translations: --- 203.0.113.50 192.168.10.5 --- --- | show arp: 192.168.10.50 reachable","Static NAT maps the public IP to the wrong private host.","Correct static NAT mapping to 192.168.10.50."
CASE-019,Wireless,Medium,2,SSID mismatch,"Laptop cannot join corporate Wi-Fi.","WLC WLAN name should be CORP.","client status: SSID CORP-NET not found | wlan summary: WLAN 1 SSID CORP enabled","Client is using the wrong SSID.","Configure the client to join SSID CORP."
CASE-020,Wireless,High,2,WPA key,"Laptop sees SSID but authentication fails.","Pre-shared key was changed during maintenance.","client log: WPA authentication failed | WLC WLAN security: WPA2-PSK enabled","Incorrect wireless pre-shared key on client or WLAN.","Set matching WPA2-PSK on the client and WLAN."
CASE-021,Wireless,Medium,2,VLAN mapping,"Wireless clients connect but get addresses from the wrong subnet.","CORP WLAN should map to VLAN 20.","show wlan summary: CORP interface guest_vlan | ipconfig: 192.168.99.18 gateway 192.168.99.1","WLAN is mapped to the wrong VLAN/interface.","Map CORP WLAN to the VLAN 20 interface."
CASE-022,VLAN,Medium,2,VLAN not created,"New sales PCs in VLAN 70 are down at Layer 2.","SW2 was configured with access vlan 70 on ports.","show vlan brief: VLAN 70 not listed | show interfaces fa0/5 switchport: Access Mode VLAN: 70 inactive","Access VLAN does not exist on the switch.","Create VLAN 70 and name it appropriately."
CASE-023,Routing,High,3,Interface down,"Site-to-site routing failed after cable move.","WAN link between R1 and R2.","show ip interface brief: Serial0/0/0 administratively down | show controllers serial0/0/0: DCE cable","WAN interface is shut down.","Issue no shutdown and configure clock rate if required."
CASE-024,Gateway,Medium,3,Wrong subnet mask,"PC can reach some local hosts but not all hosts in the expected subnet.","LAN should be 172.16.4.0/23.","ipconfig: IPv4 172.16.5.10 Mask 255.255.255.0 Gateway 172.16.4.1","Client subnet mask is too narrow.","Set mask to 255.255.254.0."
CASE-025,DHCP,Low,7,Pool exhaustion,"Only the newest lab PCs fail to get DHCP addresses.","Small DHCP pool was created for 10 test devices.","show ip dhcp pool LAB: Leased addresses 10; total addresses 10; excluded 192.168.80.1-192.168.80.244","DHCP pool is exhausted.","Increase the available address range or reduce exclusions."
CASE-026,DNS,Medium,7,Gateway vs DNS confusion,"Browser fails by name, but pinging the web server IP works.","DHCP options were recently edited.","ipconfig /all: Default Gateway 192.168.10.1 DNS Servers 192.168.10.1 | show hosts on router: no DNS records","Clients use the router as DNS when it is not providing DNS service.","Set DHCP DNS option to the actual DNS server."
CASE-027,ACL,High,4,Port-specific deny,"SSH to switch management fails from admin PC; ping works.","Management ACL controls VTY access.","show access-lists MGMT: deny tcp host 192.168.10.25 any eq 22 permit ip any any | show run line vty: access-class MGMT in","Management ACL denies SSH from admin PC.","Permit the admin PC for SSH or correct the ACL order."
CASE-028,NAT,High,3,Default route missing,"Inside users have NAT translations but no internet response.","R1 connects to ISP on S0/0/0.","show ip nat translations: icmp 203.0.113.2:4 192.168.10.25:4 8.8.8.8:4 8.8.8.8:4 | show ip route: Gateway of last resort is not set","Default route to ISP is missing.","Add a default route toward the ISP next hop."
CASE-029,VLAN,High,2,Native VLAN mismatch,"Intermittent connectivity and CDP native VLAN warnings.","SW1 and SW2 trunk over Gi0/1.","show interfaces trunk: SW1 native vlan 99; SW2 native vlan 1 | CDP-4-NATIVE_VLAN_MISMATCH on Gi0/1","Native VLAN mismatch on trunk.","Set matching native VLAN on both trunk ends."
CASE-030,Wireless,Low,1,Radio disabled,"Wireless clients cannot see any SSIDs near AP1.","AP1 was powered but no clients associate.","show ap summary: AP1 registered; Radio 2.4GHz Disabled Radio 5GHz Disabled","AP radios are disabled.","Enable required AP radios."
CASE-031,Routing,Medium,3,Duplicate IP,"Gateway flaps and ARP table changes repeatedly.","Two router interfaces were copied from the same template.","show ip interface brief: R1 Gi0/0 192.168.10.1 up/up; R2 Gi0/0 192.168.10.1 up/up | arp entries change between MAC addresses","Duplicate IP address on gateway interfaces.","Assign unique IP addresses and update clients if needed."
CASE-032,VLAN,Medium,2,Spanning tree blocked,"One access switch loses VLAN 10 reachability through redundant links.","STP protects redundant topology.","show spanning-tree vlan 10: Gi0/2 Altn BLK | intended uplink Gi0/1 forwarding","Traffic expected on a blocked STP path due to wrong uplink assumption.","Use the forwarding uplink or adjust STP priority/design intentionally."`;

    const reviewCsv = `case_id,ai_status,ai_summary,human_decision,human_correction,why_it_matters
CASE-003,Edited,"AI blamed inter-VLAN routing because remote networks failed.","Edited","Evidence showed the PC gateway was 192.168.10.254 while the router gateway was 192.168.10.1.","A routing fix would not repair a bad client gateway."
CASE-007,Rejected,"AI suggested the router subinterface was down.","Rejected","The DHCP binding showed clients were receiving 192.168.6.0/24 addresses for a 192.168.60.0/24 VLAN.","Interface state was not the fault; DHCP pool network was wrong."
CASE-014,Edited,"AI said ACL 101 blocked all traffic.","Edited","ACL 101 permitted one subnet but omitted required permits for other subnets, causing implicit deny.","The fix must add specific permits, not simply delete security policy."
CASE-018,Rejected,"AI recommended opening firewall ports.","Rejected","Static NAT mapped 203.0.113.50 to 192.168.10.5 instead of the web server 192.168.10.50.","The service was reachable internally; the translation target was wrong."
CASE-021,Edited,"AI blamed DHCP scope exhaustion.","Edited","Wireless clients got addresses from guest VLAN 99, proving the WLAN-to-VLAN mapping was wrong.","Adding DHCP addresses would expand the wrong network."`;

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && quoted && next === '"') { cell += '"'; i++; }
        else if (ch === '"') quoted = !quoted;
        else if (ch === "," && !quoted) { row.push(cell); cell = ""; }
        else if (ch === "\n" && !quoted) { row.push(cell); rows.push(row); row = []; cell = ""; }
        else cell += ch;
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      const [headers, ...data] = rows;
      return data.filter(r => r.length === headers.length).map(r => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
    }

    const cases = parseCsv(casesCsv);
    const reviews = parseCsv(reviewCsv);
    const counts = (key) => cases.reduce((acc, row) => ((acc[row[key]] = (acc[row[key]] || 0) + 1), acc), {});
    const byIssue = counts("issue_type");
    const bySeverity = counts("severity");
    const accepted = cases.length - reviews.length;
    const agreement = Math.round((accepted / cases.length) * 100);

    document.getElementById("metrics").innerHTML = [
      ["Cases", cases.length],
      ["Issue Types", Object.keys(byIssue).length],
      ["Human Corrections", reviews.length],
      ["AI Agreement", `${agreement}%`]
    ].map(([label, value]) => `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`).join("");

    function bars(target, data) {
      const max = Math.max(...Object.values(data));
      document.getElementById(target).innerHTML = Object.entries(data)
        .sort((a, b) => b[1] - a[1])
        .map(([label, value]) => `<div class="bar"><span>${label}</span><div class="track"><div class="fill" style="width:${(value / max) * 100}%"></div></div><strong>${value}</strong></div>`)
        .join("");
    }
    bars("coverage", byIssue);
    bars("severity", bySeverity);

    document.getElementById("reviewRows").innerHTML = reviews.map(row => `
      <tr>
        <td><span class="tag">${row.case_id}</span></td>
        <td>${row.human_decision}</td>
        <td>${row.human_correction}</td>
      </tr>`).join("");

    document.getElementById("demo").textContent = JSON.stringify({
      case_id: "CASE-001",
      diagnosis: "PC access port is in the wrong VLAN.",
      evidence: ["Fa0/12 listed in VLAN 1", "VLAN 30 missing Fa0/12"],
      human_review: "Accepted",
      fix: "Set Fa0/12 to access VLAN 30 and verify with show vlan brief."
    }, null, 2);
  </script>
</body>
</html>
